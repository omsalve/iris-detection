[phases.setup]
nixPkgs = ["python311", "cmake", "gcc", "gnumake", "stdenv.cc.cc.lib", "libgcc", "openblas", "liblapack", "boost", "pkg-config"]

[phases.install]
cmds = [
  "pip install --upgrade pip setuptools wheel",
  "pip install cmake",
  "CMAKE_ARGS='-DCMAKE_POLICY_VERSION_MINIMUM=3.5 -DDLIB_NO_GUI_SUPPORT=ON' pip install dlib==19.24.2",
  "pip install face-recognition==1.3.0",
  "pip install fastapi uvicorn opencv-python-headless numpy firebase-admin twilio python-dotenv python-multipart"
]

[deploy]
startCommand = "uvicorn main:app --host 0.0.0.0 --port $PORT"